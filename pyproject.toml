[project]
name = "maintainerkit"
version = "0.1.0"
description = "Review-first issue triage for open-source maintainers"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "MaintainerKit contributors" }]
keywords = ["github-actions", "open-source", "issue-triage", "maintainer-tools"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Plugins",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Bug Tracking",
]
